version: "3.9"

services:
    api:
        build:
            context: ..
            dockerfile: docker/dockerfile
        ports:
          - "8000:8000"
        volumes:
          - memories_data:/app/data 
        environment:
          - LOG_LEVEL=INFO
          - HF_HUB_OFFLINE=1
          - DB_PATH=/app/data/memories.db 
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s

volumes:
    memories_data: