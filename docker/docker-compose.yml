version: "3.9"

services:
    api:
        build:
            context: ..
            dockerfile: docker/dockerfile
        ports:
          - "8000:8000"
        volumes:
          - memories_data:/app/data 
        environment:
          - LOG_LEVEL=INFO
          - HF_HUB_OFFLINE=1
          - DB_PATH=/app/data/memories.db 
        depends_on:
            postgres:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s


    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: memorycore
            POSTGRES_PASSWORD: memorycore
            POSTGRES_DB: memorycore
        ports:
          - "5432:5432"
        volumes:
          - postgres_data:/var/lib/postgresq1/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U memorycore"]
            interval: 5s
            timeout: 5s
            retries: 5


volumes:
    memories_data:
    postgres_data: